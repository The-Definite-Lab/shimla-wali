<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <!-- Helmet Metallic White Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Helmet Chrome Bezel -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glossy Visor Screen Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Apple Leaf Green Gradients -->
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Headset Metallic & Glow -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glowEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Head -->
  <circle cx="100" cy="115" r="75" fill="url(#bgGlow)"/>

  <!-- Top Apple Leaves (Centered, Upright, Natural) -->
  <g filter="url(#leafShadow)">
    <!-- Tiny Stem -->
    <path d="M100 62 Q102 48 98 42" fill="none" stroke="#854d0e" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M98 56 C80 46 70 30 78 18 C92 18 102 38 98 56 Z" fill="url(#leafGradLeft)"/>
    <path d="M96 52 Q87 36 82 22" fill="none" stroke="#bbf7d0" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    
    <!-- Right Leaf -->
    <path d="M100 58 C118 48 130 32 122 20 C106 22 96 42 100 58 Z" fill="url(#leafGradRight)"/>
    <path d="M102 54 Q111 38 118 24" fill="none" stroke="#dcfce7" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Headset Arch Band (Behind Head) -->
  <path d="M38 115 C38 60 162 60 162 115" fill="none" stroke="url(#headsetGrad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Main Robot Head Shell (Symmetrical, Upright, Softly Rounded) -->
  <rect x="36" y="58" width="128" height="110" rx="46" fill="url(#helmetGrad)" filter="url(#softShadow)" stroke="url(#bezelGrad)" stroke-width="2"/>

  <!-- Head Top Specular Highlight -->
  <path d="M56 68 Q100 60 144 68" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Glossy Visor Screen Face (Centered) -->
  <rect x="49" y="76" width="102" height="74" rx="28" fill="url(#visorGrad)" stroke="#334155" stroke-width="1.8"/>

  <!-- Visor Subtle Gloss Arc -->
  <path d="M58 84 Q100 78 142 84" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.25"/>

  <!-- Friendly Smiling LED Eyes (Curved Warm Expression) -->
  <!-- Left Eye -->
  <path d="M68 111 Q78 100 88 111" fill="none" stroke="#4ade80" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Right Eye -->
  <path d="M112 111 Q122 100 132 111" fill="none" stroke="#4ade80" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Friendly Smile Arc -->
  <path d="M91 128 Q100 136 109 128" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>

  <!-- Cheerful Soft Blush Accents -->
  <circle cx="67" cy="124" r="5" fill="#22c55e" opacity="0.28"/>
  <circle cx="133" cy="124" r="5" fill="#22c55e" opacity="0.28"/>

  <!-- Left Headset Earcup (Emerald Accent Ring) -->
  <g>
    <rect x="26" y="96" width="14" height="38" rx="7" fill="url(#headsetGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="33" cy="115" r="5.5" fill="url(#glowEarGrad)"/>
    <circle cx="33" cy="115" r="2.5" fill="#86efac"/>
  </g>

  <!-- Right Headset Earcup + Mic Boom -->
  <g>
    <rect x="160" y="96" width="14" height="38" rx="7" fill="url(#headsetGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="167" cy="115" r="5.5" fill="url(#glowEarGrad)"/>
    <circle cx="167" cy="115" r="2.5" fill="#86efac"/>
    
    <!-- Boom Mic -->
    <path d="M165 125 Q160 148 135 152" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="132" cy="152" r="4.5" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  </g>
</svg>